<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>허들링 체크인 보드</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #14171f;
      --muted: #6b7280;
      --line: #e3e7ef;
      --accent: #2f5bff;
      --accent-soft: #e8eeff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --surface: #181b24;
        --ink: #eef0f5;
        --muted: #9aa1b0;
        --line: #2a2f3b;
        --accent: #7c9bff;
        --accent-soft: #1f2740;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
    .eyebrow {
      display: inline-block;
      font-size: 13px; font-weight: 600;
      color: var(--accent); background: var(--accent-soft);
      padding: 4px 10px; border-radius: 999px;
    }
    h1 { font-size: clamp(26px, 6vw, 36px); margin: 14px 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 32px; }

    .how {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px; margin-bottom: 28px; font-size: 14px;
    }
    .how b { display: block; margin-bottom: 6px; font-size: 15px; }
    .how ol { margin: 0; padding-left: 20px; color: var(--muted); }
    .how code {
      font-size: 13px; background: var(--accent-soft); color: var(--accent);
      padding: 1px 6px; border-radius: 6px;
    }

    .count { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
    .count strong { color: var(--ink); }

    ul.board {
      list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
    }
    ul.board li {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; font-size: 15px;
    }
    ul.board li .name { font-weight: 700; display: block; margin-bottom: 2px; }
    ul.board li .msg { color: var(--muted); font-size: 14px; }

    footer {
      margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
      font-size: 13px; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 8px 20px;
    }
    footer strong { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">허들링 클럽 · 2회 오프라인 밋업</span>
    <h1>11/14 협업 실험실 체크인</h1>
    <p class="sub">깃허브에 푸시하면 Vercel이 자동으로 다시 배포해요. 내 카드가 보이면 성공!</p>

    <div class="how">
      <b>체크인 방법</b>
      <ol>
        <li><code>checkin/index.html</code>에서 아래 예시 카드 <code>&lt;li&gt;</code> 한 줄을 복사해 내 이름과 한마디로 바꾸기</li>
        <li>맨 아래 <code>VERSION</code> 문구도 바꾸기 (예: v2 · 이름)</li>
        <li>커밋 → 푸시 → 1~2분 뒤 새로고침</li>
      </ol>
    </div>

    <p class="count">지금까지 체크인 <strong id="count">0</strong>명</p>

    <ul class="board" id="board">
      <!-- ▼ 여기 아래에 한 줄씩 추가해 주세요 -->
      <li><span class="name">비비</span><span class="msg">배포 테스트 첫 번째 카드 🐧</span></li>
      <!-- ▲ 여기까지 -->
    </ul>

    <footer>
      <span>VERSION <strong id="version">v1 · 비비</strong></span>
      <span>마지막 수정 <strong id="updated">-</strong></span>
    </footer>
  </main>

  <script>
    document.getElementById('count').textContent =
      document.querySelectorAll('#board li').length;
    var d = new Date(document.lastModified);
    if (!isNaN(d)) {
      document.getElementById('updated').textContent =
        d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
